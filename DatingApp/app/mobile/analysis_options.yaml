# Static analysis configuration. Run with `flutter analyze`.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Generated Riverpod code is verified by build_runner, not hand-edited.
  exclude:
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: true
    directives_ordering: true
    avoid_print: true
